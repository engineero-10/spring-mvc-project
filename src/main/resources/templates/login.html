<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" dir="ltr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            /* نفس خلفية الأزرق الداكن جداً (Midnight Blue) */
            background-color: #0b1426;
        }
        .card {
            border: 1px solid #1e2d4a;
            border-radius: 16px;
            background-color: #13223f;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .form-control {
            background-color: #1a2f56;
            border-color: #26437a;
            color: #ffffff;
        }
        .form-control::placeholder {
            color: #7a94c5;
        }
        .form-control:focus {
            background-color: #1e3663;
            border-color: #3b82f6;
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
            color: #ffffff;
        }
        .text-muted-custom {
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center pt-5"> <div class="col-md-5">
        <div class="alert alert-primary alert-dismissible fade show shadow-sm border-0 bg-success bg-opacity-25 text-success-light" role="alert">
            <span th:text="${registeredNumber}">0 </span> Instructors Logged In Now!
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm border-0 bg-danger bg-opacity-25 text-danger-light" role="alert">
            <span>Invalid email or password.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card p-4 mt-3">
            <h3 class="text-center mb-4 text-info fw-bold">Instructor Login</h3>

            <form th:action="@{/login}" method="POST">

                <div class="mb-3">
                    <label th:for="email" class="form-label fw-semibold text-light">Email Address</label>
                    <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
                </div>

                <div class="mb-3">
                    <label th:for="password" class="form-label fw-semibold text-light">Password</label>
                    <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div class="mb-4 form-check">
                    <input type="checkbox" name="remember-me" id="remember-me" class="form-check-input">
                    <label for="remember-me" class="form-check-label text-muted-custom">Remember me</label>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm">Sign In</button>
                </div>

                <hr class="border-secondary opacity-25">

                <div class="text-center mt-3">
                    <span class="text-muted-custom">Don't have an account? </span>
                    <a th:href="@{/register}" class="text-info text-decoration-none fw-semibold">Register here</a>
                </div>

            </form>
        </div>

    </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
