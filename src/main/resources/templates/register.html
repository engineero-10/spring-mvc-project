<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" dir="ltr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Instructor Account</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            /* خلفية أزرق داكن جداً (Midnight Blue) */
            background-color: #0b1426;
        }

        .card {
            border: 1px solid #1e2d4a; /* إطار خفيف لتحديد البطاقة */
            border-radius: 16px;
            /* لون البطاقة أزرق داكن بدرجة أفتح قليلاً ليعطي أبعاداً للتصميم */
            background-color: #13223f;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .form-control, .form-select {
            /* تنسيق الحقول لتتناسب مع درجات الأزرق */
            background-color: #1a2f56;
            border-color: #26437a;
            color: #ffffff;
        }

        .form-control::placeholder {
            color: #7a94c5; /* لون حقل المساعدة النصي ليصبح متناسقاً */
        }

        .form-control:focus, .form-select:focus {
            background-color: #1e3663;
            border-color: #3b82f6; /* توهج أزرق مضيء عند الضغط */
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
            color: #ffffff;
        }

        /* تعديل الخطوط لتكون أكثر وضوحاً ونعومة */
        .text-muted-custom {
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="alert alert-primary alert-dismissible fade show shadow-sm border-0 bg-success bg-opacity-25 text-success-light"
                 role="alert">
                <span th:text="${registeredNumber}">0 </span> Instructors Logged In Now!
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${successMessage}"
                 class="alert alert-success alert-dismissible fade show shadow-sm border-0 bg-success bg-opacity-25 text-success-light"
                 role="alert">
                <span th:text="${successMessage}">Register Successfully</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${error}"
                 class="alert alert-danger alert-dismissible fade show shadow-sm border-0 bg-success bg-opacity-25 text-success-light"
                 role="alert">
                <span>Email Already Exist Try Another One</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div class="card p-4">
                <h3 class="text-center mb-4 text-info fw-bold">Create New Instructor Account</h3>

                <form th:action="@{/register}" th:object="${instructor}" method="POST">

                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold text-light">Full Name</label>
                        <input type="text" th:field="*{name}" id="name" class="form-control" placeholder="Name"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold text-light">Email</label>
                        <input type="email" th:field="*{email}" id="email" class="form-control"
                               placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold text-light">Password</label>
                        <input type="password" th:field="*{password}" id="password" class="form-control" required>
                    </div>

                    <div class="mb-4">
                        <label for="specialization" class="form-label fw-semibold text-light">Specialization</label>
                        <select th:field="*{specialization}" id="specialization" class="form-select" required>
                            <option value="" selected disabled>Choice Specialization</option>
                            <option value="BACK_END">Back End</option>
                            <option value="FRONT_END">Front End</option>
                            <option value="DATABASE">Database</option>
                            <option value="AI">AI</option>
                            <option value="NETWORKING">Networking</option>
                        </select>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm">Register</button>
                    </div>

                    <hr class="border-secondary opacity-25">

                    <div class="text-center mt-3">
                        <span class="text-muted-custom">Already have an account? </span>
                        <a th:href="@{/login}" class="text-info text-decoration-none fw-semibold">Login here</a>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
